<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previsão CNP Boituva</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: quadro de briefing operacional - uma faixa por dia, empilhadas; clicar
   abre a matriz hora x categoria daquele dia. A categoria do leitor fica
   destacada em todas as faixas. */
:root {
  --ceu: #e8edf2;          /* fundo, neutro com viés azul (painel de instrumento) */
  --painel: #ffffff;
  --painel-2: #f2f5f8;
  --tinta: #16222e;
  --tinta-fraca: #5a6a78;
  --borda: #c9d4de;
  --biruta: #d9622b;       /* laranja de biruta, o acento */
  --alta: #2f7a4d;
  --media: #a8740c;
  --baixa: #ad3826;
  --alta-fundo: #e3f1e8;
  --media-fundo: #faf0da;
  --baixa-fundo: #f9e4e0;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --corpo: "Barlow", system-ui, -apple-system, sans-serif;
  --dados: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ceu: #11191f;
    --painel: #19242d;
    --painel-2: #1f2d37;
    --tinta: #e6eef4;
    --tinta-fraca: #94a6b4;
    --borda: #2e4050;
    --biruta: #f08350;
    --alta: #6fc492;
    --media: #e0b254;
    --baixa: #ef8674;
    --alta-fundo: #1b3326;
    --media-fundo: #342a14;
    --baixa-fundo: #38201c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ceu: #11191f;
  --painel: #19242d;
  --painel-2: #1f2d37;
  --tinta: #e6eef4;
  --tinta-fraca: #94a6b4;
  --borda: #2e4050;
  --biruta: #f08350;
  --alta: #6fc492;
  --media: #e0b254;
  --baixa: #ef8674;
  --alta-fundo: #1b3326;
  --media-fundo: #342a14;
  --baixa-fundo: #38201c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--ceu);
  color: var(--tinta);
  font-family: var(--corpo);
  font-size: 15px;
  line-height: 1.5;
}
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; }

/* ---------- cabeçalho ---------- */
.topo { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 6px; }
h1 {
  font-family: var(--display);
  font-weight: 700; font-size: clamp(30px, 6vw, 44px);
  letter-spacing: -0.01em; line-height: 1; margin: 0;
  text-wrap: balance;
}
.nav { margin-left: auto; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; }
.nav a { color: var(--biruta); text-decoration: none; }
.nav a:hover { text-decoration: underline; }
.local {
  font-family: var(--display); font-weight: 600; font-size: 15px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--biruta);
}
.gerado {
  font-family: var(--dados); font-size: 12px; color: var(--tinta-fraca);
  margin: 0 0 18px;
}

/* ---------- aviso ---------- */
.aviso {
  border-left: 3px solid var(--biruta);
  background: var(--painel);
  border-radius: 0 6px 6px 0;
  padding: 13px 16px;
  margin-bottom: 26px;
  font-size: 14px;
}
.aviso strong { font-weight: 600; }
.aviso p { margin: 0; }
.aviso p + p { margin-top: 7px; color: var(--tinta-fraca); }
.aviso p.fixo { font-weight: 600; color: var(--tinta); }

/* ---------- rajada nas proximas horas (modulo de rajada) ---------- */
.rajada {
  background: var(--painel); border: 1px solid var(--borda); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 26px;
}
.rajada-titulo {
  font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 12px; font-weight: 600; color: var(--tinta-fraca); margin-bottom: 4px;
}
.rajada-obs { font-size: 13px; color: var(--tinta-fraca); margin: 0 0 10px; }
.rajada-horas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.rajada-h { border: 1px solid var(--borda); border-radius: 6px; padding: 9px 11px; background: var(--painel-2); }
.rajada-h .quando { font-family: var(--dados); font-size: 12px; color: var(--tinta-fraca); }
.rajada-h .valor { font-family: var(--dados); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.rajada-h .valor small { font-size: 13px; font-weight: 500; color: var(--tinta-fraca); }
.rajada-h .faixa { font-size: 13px; margin-top: 2px; }
.rajada-h .alerta { font-size: 13px; font-weight: 600; color: var(--baixa); margin-top: 4px; }
.rajada-h .conf { font-size: 12px; color: var(--tinta-fraca); margin-top: 4px; }
.rajada-nota { font-size: 12.5px; color: var(--tinta-fraca); margin: 10px 0 0; max-width: 70ch; }
.rajada.indisp { color: var(--tinta-fraca); font-size: 14px; }

/* ---------- estacao do CNP ao vivo (Klimadata) ---------- */
.estacao {
  background: var(--painel); border: 1px solid var(--borda); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 14px;
}
.estacao-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.estacao-titulo {
  font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 12px; font-weight: 600; color: var(--tinta-fraca);
}
.estacao-vivo {
  font: inherit; font-size: 13px; color: var(--biruta); background: none; border: 0;
  padding: 0; cursor: pointer; white-space: nowrap;
}
.estacao-vivo:focus-visible { outline: 2px solid var(--biruta); outline-offset: 2px; }
.estacao-vento { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.estacao-seta { width: 44px; height: 44px; flex: none; }
.estacao-seta circle { fill: none; stroke: var(--borda); stroke-width: 2; }
.estacao-seta path { fill: var(--biruta); }
.estacao-num { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.estacao-num small { font-family: inherit; font-size: 13px; font-weight: 500; color: var(--tinta-fraca); }
.estacao-rot { font-size: 12px; color: var(--tinta-fraca); }
.estacao-resto { font-size: 13.5px; color: var(--tinta-fraca); margin-top: 8px; font-variant-numeric: tabular-nums; }
.estacao.velho .estacao-vento { opacity: 0.55; }
.estacao.indisp { color: var(--tinta-fraca); font-size: 14px; }
.estacao-janela { margin-top: 12px; overflow: hidden; border: 1px solid var(--borda); border-radius: 6px; background: #fff; }
.estacao-janela iframe { border: 0; width: 800px; height: 430px; transform-origin: 0 0; display: block; }

/* ---------- agora, com satelite (modulo_satelite, T15) ---------- */
.agora {
  background: var(--painel); border: 1px solid var(--borda); border-left: 3px solid var(--alta);
  border-radius: 0 8px 8px 0; padding: 14px 16px; margin-bottom: 14px;
}
.agora-titulo {
  font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 12px; font-weight: 600; color: var(--tinta-fraca); margin-bottom: 4px;
}
.agora-obs { font-size: 13px; color: var(--tinta-fraca); margin: 0 0 10px; }
.agora-sem { font-size: 13px; color: var(--tinta-fraca); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.agora-nota { font-size: 12.5px; color: var(--tinta-fraca); margin: 10px 0 0; max-width: 70ch; }
.agora.indisp { border-left-color: var(--borda); color: var(--tinta-fraca); font-size: 14px; }
.agora.velho { border-left-color: var(--borda); }
.agora.velho .chips { opacity: 0.5; }

/* ---------- seletor de categoria ---------- */
.seletor { margin-bottom: 22px; }
.seletor-rotulo {
  font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 12px; font-weight: 600; color: var(--tinta-fraca); display: block; margin-bottom: 7px;
}
.cats { display: flex; flex-wrap: wrap; gap: 7px; }
.cats button {
  font-family: var(--display); font-weight: 600; font-size: 15px;
  letter-spacing: 0.04em;
  padding: 7px 15px; border-radius: 999px;
  border: 1px solid var(--borda); background: var(--painel); color: var(--tinta);
  cursor: pointer; transition: background .13s, border-color .13s, color .13s;
}
.cats button:hover { border-color: var(--biruta); }
.cats button[aria-pressed="true"] {
  background: var(--biruta); border-color: var(--biruta); color: #fff;
}
.cats button:focus-visible { outline: 2px solid var(--biruta); outline-offset: 2px; }

/* ---------- quadro de dias ---------- */
.quadro { display: flex; flex-direction: column; gap: 10px; }
.dia {
  background: var(--painel);
  border: 1px solid var(--borda);
  border-radius: 8px;
  overflow: hidden;
}
.dia.hoje { border-color: var(--biruta); }

.cabeca {
  width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  font: inherit; color: inherit;
  padding: 14px 16px;
  display: grid; grid-template-columns: 108px minmax(0, 1fr) 22px;
  gap: 4px 18px; align-items: start;
}
/* posicao explicita dos tres filhos - sem auto-placement, que no breakpoint
   de celular jogava a coluna de conteudo pra faixa estreita da seta */
.cabeca > .data-bloco { grid-column: 1; grid-row: 1; }
.cabeca > .direita    { grid-column: 2; grid-row: 1; }
.cabeca > .seta       { grid-column: 3; grid-row: 1; }
.cabeca:hover { background: var(--painel-2); }
.cabeca:focus-visible { outline: 2px solid var(--biruta); outline-offset: -2px; }

.data-bloco { display: flex; flex-direction: column; gap: 1px; }
.dia-semana {
  font-family: var(--display); font-weight: 700; font-size: 20px;
  text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.1;
}
.data-num { font-family: var(--dados); font-size: 12px; color: var(--tinta-fraca); }
.marca-hoje {
  font-family: var(--display); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--biruta); margin-top: 2px;
}
.marca-conf {
  font-family: var(--display); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--tinta-fraca); margin-top: 2px;
}
.marca-sem-val {
  font-family: var(--display); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--tinta-fraca); margin-top: 2px;
}

.direita { display: flex; flex-direction: column; gap: 11px; min-width: 0; }
.resumo { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.resumo span { color: var(--tinta-fraca); font-weight: 500; font-size: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: flex; align-items: baseline; gap: 6px;
  border: 1px solid var(--borda); border-radius: 6px;
  padding: 5px 9px; background: var(--painel-2);
}
.chip { white-space: nowrap; }
.chip .cat { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
.chip .pct { font-family: var(--dados); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip.alta { background: var(--alta-fundo); border-color: color-mix(in srgb, var(--alta) 40%, transparent); }
.chip.alta .pct { color: var(--alta); }
.chip.media { background: var(--media-fundo); border-color: color-mix(in srgb, var(--media) 40%, transparent); }
.chip.media .pct { color: var(--media); }
.chip.baixa { background: var(--baixa-fundo); border-color: color-mix(in srgb, var(--baixa) 45%, transparent); }
.chip.baixa .pct { color: var(--baixa); }
.chip.minha { box-shadow: 0 0 0 2px var(--biruta); }

.tempo {
  display: flex; flex-wrap: wrap; gap: 3px 16px;
  font-family: var(--dados); font-size: 12.5px; color: var(--tinta-fraca);
  font-variant-numeric: tabular-nums;
}
.tempo > span { white-space: nowrap; }
.tempo b { font-weight: 500; color: var(--tinta); }
.alerta-vento { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--baixa); }

.seta {
  font-family: var(--dados); font-size: 15px; color: var(--tinta-fraca);
  justify-self: end; align-self: center; transition: transform .15s;
}
.cabeca[aria-expanded="true"] .seta { transform: rotate(90deg); }

.dia.sem-val .cabeca { background: repeating-linear-gradient(
  135deg, transparent, transparent 9px,
  color-mix(in srgb, var(--borda) 28%, transparent) 9px,
  color-mix(in srgb, var(--borda) 28%, transparent) 10px); }
.dia.sem-val .cabeca:hover { background: var(--painel-2); }

/* ---------- detalhe hora a hora ---------- */
.detalhe { border-top: 1px solid var(--borda); padding: 14px 16px 16px; background: var(--painel-2); }
.detalhe-titulo {
  font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 12px; font-weight: 600; color: var(--tinta-fraca); margin-bottom: 10px;
}
.grade-wrap { overflow-x: auto; padding-bottom: 4px; }
.grade {
  display: grid; gap: 2px;
  font-family: var(--dados); font-size: 12px; font-variant-numeric: tabular-nums;
  min-width: max-content;
}
.gcel {
  padding: 4px 6px; border-radius: 3px; text-align: center; white-space: nowrap;
  background: var(--painel);
}
.gcel.rotulo {
  font-family: var(--display); font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.05em;
  text-align: left; background: none; color: var(--tinta-fraca);
  padding-right: 10px; position: sticky; left: 0;
  box-shadow: 6px 0 6px -6px color-mix(in srgb, var(--tinta) 22%, transparent);
}
.gcel.rotulo.cat-rot { color: var(--tinta); font-weight: 700; font-size: 13px; }
.gcel.rotulo.minha { color: var(--biruta); }
.gcel.hora { font-weight: 600; color: var(--tinta-fraca); background: none; }
.gcel.hora.fora { opacity: .45; }
.gcel.p { font-weight: 600; }
.gcel.p.alta { background: var(--alta-fundo); color: var(--alta); }
.gcel.p.media { background: var(--media-fundo); color: var(--media); }
.gcel.p.baixa { background: var(--baixa-fundo); color: var(--baixa); }
.gcel.p.fora { opacity: .42; }
.gcel.num { color: var(--tinta); }
.gcel.num.fora { opacity: .42; }
.gcel.num.alerta { color: var(--baixa); font-weight: 600; }
.linha-minha .gcel.p { box-shadow: inset 0 0 0 1.5px var(--biruta); }

.legenda {
  display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 11px;
  font-size: 12px; color: var(--tinta-fraca);
}
.legenda span { display: flex; align-items: center; gap: 5px; }
.legenda i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

/* ---------- seções de texto ---------- */
h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.01em; margin: 38px 0 10px; }
.texto { max-width: 62ch; }
.texto p { margin: 0 0 11px; }
.texto p:last-child { margin-bottom: 0; }
.texto code { font-family: var(--dados); font-size: 0.9em; background: var(--painel-2); padding: 1px 5px; border-radius: 3px; }

.tabela-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; min-width: 380px; }
th, td { text-align: right; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--borda); font-variant-numeric: tabular-nums; }
th {
  font-family: var(--display); font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--tinta-fraca);
}
th:first-child, td:first-child { text-align: left; }
td.cat-col { font-family: var(--display); font-weight: 700; font-size: 15px; }
td { font-family: var(--dados); }

.rodape {
  margin-top: 42px; padding-top: 18px; border-top: 1px solid var(--borda);
  font-size: 13px; color: var(--tinta-fraca); max-width: 62ch;
}
.rodape p { margin: 0 0 8px; }

@media (max-width: 560px) {
  .cabeca { grid-template-columns: minmax(0, 1fr) 22px; gap: 10px 12px; }
  .cabeca > .data-bloco {
    grid-column: 1; grid-row: 1;
    flex-direction: row; align-items: baseline; gap: 9px; flex-wrap: wrap;
  }
  .cabeca > .seta    { grid-column: 2; grid-row: 1; align-self: center; }
  .cabeca > .direita { grid-column: 1 / -1; grid-row: 2; }
  .marca-hoje, .marca-sem-val, .marca-conf { margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const DIAS_SEM = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const COLUNAS = [
  { rotulo: "A / AI", chave: "A" },
  { rotulo: "B", chave: "B" },
  { rotulo: "C", chave: "C" },
  { rotulo: "D", chave: "D" },
];
const CHAVE_LS = "cnp-categoria";
// regra 1 da DIRECAO_TCC: vento sempre em km/h (o JSON ainda guarda em nos)
const KMH = kt => kt * 1.852;
let minhaCat = null;
let diaAberto = DADOS.dias.length ? DADOS.dias[0].data : null;

try { minhaCat = localStorage.getItem(CHAVE_LS); } catch (e) { minhaCat = null; }

// aberta prevista a partir de LIMIAR (o mesmo da pagina de historico);
// no Agora a partir de LIMIAR_AGORA (T54: o corte de 50% acerta mais)
const LIMIAR = 0.70;
const LIMIAR_AGORA = 0.50;
function faixa(p, lim = LIMIAR) {
  if (p >= lim) return "alta";
  if (p >= (lim > 0.5 ? 0.5 : lim - 0.15)) return "media";
  return "baixa";
}

// categorias com chance >= lim; D >= C >= B >= A sempre
function decisaoPrevista(pc, lim = LIMIAR) {
  const abertas = ["D", "C", "B", "A"].filter(k => pc[k] >= lim);
  if (!abertas.length) return "fechada";
  if (abertas.length === 4) return "aberta para todas";
  if (abertas.length === 1) return "aberta só para D";
  return "aberta para " + abertas.reverse().join(", ").replace(/, ([^,]*)$/, " e $1");
}

function dataLocal(iso) {
  const [a, m, d] = iso.split("-").map(Number);
  return new Date(a, m - 1, d);
}

function cel(classe, texto) {
  const e = document.createElement("div");
  e.className = "gcel " + classe;
  e.textContent = texto;
  return e;
}

function montarSeletor() {
  const alvo = document.getElementById("cats");
  alvo.replaceChildren();
  const opcoes = [...COLUNAS.map(c => c.rotulo), null];
  for (const rotulo of opcoes) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = rotulo === null ? "mostrar todas" : rotulo;
    b.setAttribute("aria-pressed", String(minhaCat === rotulo));
    b.addEventListener("click", () => {
      minhaCat = rotulo;
      try {
        if (rotulo === null) localStorage.removeItem(CHAVE_LS);
        else localStorage.setItem(CHAVE_LS, rotulo);
      } catch (e) { /* modo privado: segue sem lembrar */ }
      montarSeletor();
      montarAgora();
      montarQuadro();
    });
    alvo.appendChild(b);
  }
}

function montarDetalhe(dia) {
  const painel = document.createElement("div");
  painel.className = "detalhe";

  const titulo = document.createElement("div");
  titulo.className = "detalhe-titulo";
  titulo.textContent = "Hora a hora · horário de Brasília";
  painel.appendChild(titulo);

  const wrap = document.createElement("div");
  wrap.className = "grade-wrap";
  const grade = document.createElement("div");
  grade.className = "grade";
  grade.style.gridTemplateColumns = "auto repeat(" + dia.horas.length + ", minmax(38px, 1fr))";

  // linha de horas
  grade.appendChild(cel("rotulo", "hora"));
  for (const h of dia.horas) {
    grade.appendChild(cel("hora" + (h.operacao ? "" : " fora"), String(h.hora).padStart(2, "0") + "h"));
  }

  // uma linha por categoria
  for (const col of COLUNAS) {
    const ehMinha = minhaCat === col.rotulo;
    const rot = cel("rotulo cat-rot" + (ehMinha ? " minha" : ""), col.rotulo);
    if (ehMinha) rot.classList.add("minha");
    grade.appendChild(rot);
    for (const h of dia.horas) {
      const p = h.prob_por_categoria[col.chave];
      const c = cel("p " + faixa(p) + (h.operacao ? "" : " fora"), Math.round(p * 100) + "");
      if (ehMinha) c.style.boxShadow = "inset 0 0 0 1.5px var(--biruta)";
      grade.appendChild(c);
    }
  }

  // linhas de tempo
  const linhas = [
    ["vento km/h", h => KMH(h.vento_kt).toFixed(0), () => false],
    ["rajada km/h", h => KMH(h.rajada_kt).toFixed(0), () => false],
    // Tentativa 15: "pode chegar a" = quantil de 90% corrigido; e ele que dispara o alerta
    ["rajada até", h => KMH(h.rajada_kt_alta ?? h.rajada_kt).toFixed(0),
      h => h.alerta_rajada ?? (h.rajada_kt > DADOS.limites_cbpq.rajada_kt)],
    ["vento alto", h => (h.alerta_camada ? "⚠" : "·"), h => !!h.alerta_camada],
    ["nuvem %", h => h.nuvem_baixa.toFixed(0), () => false],
    ["chuva mm", h => h.chuva_mm.toFixed(1), h => h.chuva_mm > 0],
  ];
  for (const [rotulo, valor, alerta] of linhas) {
    grade.appendChild(cel("rotulo", rotulo));
    for (const h of dia.horas) {
      grade.appendChild(cel("num" + (h.operacao ? "" : " fora") + (alerta(h) ? " alerta" : ""), valor(h)));
    }
  }

  wrap.appendChild(grade);
  painel.appendChild(wrap);

  const leg = document.createElement("div");
  leg.className = "legenda";
  const itens = [
    ["var(--alta)", Math.round(LIMIAR * 100) + "% ou mais"],
    ["var(--media)", "50% a " + (Math.round(LIMIAR * 100) - 1) + "%"],
    ["var(--baixa)", "abaixo de 50%"],
  ];
  for (const [cor, texto] of itens) {
    const s = document.createElement("span");
    const i = document.createElement("i");
    i.style.background = cor;
    s.append(i, document.createTextNode(texto));
    leg.appendChild(s);
  }
  painel.appendChild(leg);

  return painel;
}

function montarQuadro() {
  const alvo = document.getElementById("quadro");
  alvo.replaceChildren();
  const hojeIso = DADOS.dias.length ? DADOS.dias[0].data : null;

  for (const dia of DADOS.dias) {
    const d = dataLocal(dia.data);
    const card = document.createElement("div");
    card.className = "dia" + (dia.data === hojeIso ? " hoje" : "") + (dia.validado ? "" : " sem-val");

    const cabeca = document.createElement("button");
    cabeca.type = "button";
    cabeca.className = "cabeca";
    cabeca.setAttribute("aria-expanded", String(diaAberto === dia.data));

    const bloco = document.createElement("div");
    bloco.className = "data-bloco";
    const ds = document.createElement("span");
    ds.className = "dia-semana";
    ds.textContent = DIAS_SEM[d.getDay()];
    const dn = document.createElement("span");
    dn.className = "data-num";
    dn.textContent = String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
    bloco.append(ds, dn);
    if (dia.data === hojeIso) {
      const hj = document.createElement("span");
      hj.className = "marca-hoje";
      hj.textContent = "hoje";
      bloco.appendChild(hj);
    } else if (!dia.validado) {
      const sv = document.createElement("span");
      sv.className = "marca-sem-val";
      sv.textContent = "d+" + dia.dias_a_frente + (dia.confianca === "climatologia"
        ? " · média histórica" : dia.confianca === "baixa" ? " · tendência" : "");
      bloco.appendChild(sv);
    } else if (dia.confianca) {
      const mc = document.createElement("span");
      mc.className = "marca-conf";
      mc.textContent = "d+" + dia.dias_a_frente + " · confiança " +
        ({ alta: "alta", media: "média", baixa: "baixa" }[dia.confianca] || dia.confianca);
      bloco.appendChild(mc);
    }

    const dir = document.createElement("div");
    dir.className = "direita";

    const resumo = document.createElement("div");
    resumo.className = "resumo";
    resumo.textContent = decisaoPrevista(dia.prob_por_categoria);

    const chips = document.createElement("div");
    chips.className = "chips";
    for (const col of COLUNAS) {
      const p = dia.prob_por_categoria[col.chave];
      const chip = document.createElement("div");
      chip.className = "chip " + faixa(p) + (minhaCat === col.rotulo ? " minha" : "");
      const cat = document.createElement("span");
      cat.className = "cat";
      cat.textContent = col.rotulo;
      const pct = document.createElement("span");
      pct.className = "pct";
      pct.textContent = Math.round(p * 100) + "%";
      chip.append(cat, pct);
      chips.appendChild(chip);
    }

    const t = dia.tempo;
    const tempo = document.createElement("div");
    tempo.className = "tempo";
    const campos = [
      ["vento", KMH(t.vento_kt_med).toFixed(0) + "–" + KMH(t.vento_kt_max).toFixed(0) + " km/h"],
      ["rajada", KMH(t.rajada_kt_max).toFixed(0) + " km/h" +
        (t.rajada_kt_alta_max != null ? " (até " + KMH(t.rajada_kt_alta_max).toFixed(0) + ")" : "")],
      ["nuvem baixa", t.nuvem_baixa_med.toFixed(0) + "%"],
      ["chuva", t.chuva_mm_total.toFixed(1) + " mm" +
        (t.prob_chuva_max != null ? " (" + t.prob_chuva_max.toFixed(0) + "%)" : "")],
      ["temp", t.temp_med.toFixed(0) + "°C"],
    ];
    for (const [rot, val] of campos) {
      const span = document.createElement("span");
      span.textContent = rot + " ";
      const b = document.createElement("b");
      b.textContent = val;
      span.appendChild(b);
      tempo.appendChild(span);
    }

    dir.append(resumo, chips, tempo);
    // Tentativa 15: aviso de vento forte possivel (q90 acima do limite em alguma hora de operacao)
    const avisos = [];
    if (t.horas_alerta_rajada > 0) avisos.push("rajada acima de " + KMH(DADOS.limites_cbpq.rajada_kt).toFixed(0) +
      " km/h possível (" + t.horas_alerta_rajada + " h)");
    if (t.horas_alerta_camada > 0) avisos.push("vento forte em altitude possível (" + t.horas_alerta_camada + " h)");
    if (avisos.length) {
      const av = document.createElement("div");
      av.className = "alerta-vento";
      av.textContent = "⚠ " + avisos.join(" · ");
      dir.appendChild(av);
    }

    const seta = document.createElement("span");
    seta.className = "seta";
    seta.textContent = "›";
    seta.setAttribute("aria-hidden", "true");

    cabeca.append(bloco, dir, seta);
    cabeca.addEventListener("click", () => {
      diaAberto = diaAberto === dia.data ? null : dia.data;
      montarQuadro();
    });
    card.appendChild(cabeca);

    if (diaAberto === dia.data && dia.horas && dia.horas.length) {
      card.appendChild(montarDetalhe(dia));
    }
    alvo.appendChild(card);
  }
}

const HORA = iso => new Date(iso).toLocaleTimeString("pt-BR",
  { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });

function chipsDe(pc, lim = LIMIAR) {
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const col of COLUNAS) {
    const p = pc[col.chave];
    const chip = document.createElement("div");
    chip.className = "chip " + faixa(p, lim) + (minhaCat === col.rotulo ? " minha" : "");
    const cat = document.createElement("span");
    cat.className = "cat";
    cat.textContent = col.rotulo;
    const pct = document.createElement("span");
    pct.className = "pct";
    pct.textContent = Math.round(p * 100) + "%";
    chip.append(cat, pct);
    chips.appendChild(chip);
  }
  return chips;
}

// O Agora vem de dois lugares: o gravado na pagina (renovado de hora em hora
// pelo notebook) e o agora.json que o GitHub Actions grava a cada 15 min no
// branch "agora" (publicar/nuvem/); vale o mais novo. Se os dois pararem, a
// pagina avisa em vez de repetir como atual o ultimo estado gravado
// (07/11/2026: das 7h19 as 11h30 ficou o "fora do horario" das 7h).
const URL_AGORA_JSON = "https://raw.githubusercontent.com/fernandoliveiraf-sudo/previsao-cnp-boituva/agora/agora.json";
const AGORA_VELHO_MIN = 75;          // renovacao de hora em hora + folga
let agoraDados = DADOS.satelite || null;
const geradoEm = x => x ? new Date(x.gerado_utc || x.ts_utc || 0).getTime() : 0;
const HORA_LOCAL = () => Number(new Date().toLocaleString("en-US",
  { hour: "numeric", hourCycle: "h23", timeZone: "America/Sao_Paulo" }));

function agoraParado(s) {
  // devolve o instante da ultima renovacao se ela passou do prazo dentro da
  // janela de operacao (8h-17h59); senao, null
  const h = HORA_LOCAL();
  if (h < 8 || h > 17) return null;
  const iso = s && (s.gerado_utc || s.ts_utc);
  if (!iso) return null;
  return (Date.now() - new Date(iso).getTime()) / 60000 > AGORA_VELHO_MIN ? iso : null;
}

function montarAgora() {
  const alvo = document.getElementById("agora");
  alvo.replaceChildren();
  alvo.classList.remove("indisp", "velho");
  const s = agoraDados;
  const titulo = document.createElement("div");
  titulo.className = "agora-titulo";
  alvo.appendChild(titulo);
  const parado = agoraParado(s);
  const avisoParado = () => {
    const n = document.createElement("div");
    n.className = "agora-sem";
    n.textContent = "Sem atualização desde " + HORA(parado) +
      ": o computador que roda o modelo ficou parado. Volta sozinho na próxima rodada.";
    return n;
  };
  if (!s || s.status !== "ok") {
    alvo.classList.add("indisp");
    if (parado) {
      titulo.textContent = "Agora · sem atualização desde " + HORA(parado);
      alvo.appendChild(avisoParado());
    } else {
      titulo.textContent = "Agora · " + (s && s.status === "fora_do_horario" ? "fora do horário" : "indisponível");
    }
    return;
  }
  titulo.textContent = "Agora · " + HORA(s.ts_utc) + "–" + HORA(s.fim_utc);
  if (parado || Date.now() > new Date(s.fim_utc).getTime() + 30 * 60 * 1000) alvo.classList.add("velho");
  const resumo = document.createElement("div");
  resumo.className = "resumo";
  resumo.style.marginBottom = "8px";
  resumo.textContent = s.trava_chuva ? "fechada · chovendo no CNP" : decisaoPrevista(s.prob_por_categoria, LIMIAR_AGORA);
  const nota = document.createElement("div");
  nota.className = "agora-sem";
  if (s.trava_chuva) {
    // chuva confirmada por duas fontes (modulo_satelite/producao.py, trava de chuva)
    const c = s.chuva_cnp || {};
    const fontes = [];
    if (c.estacao_mmh > 0) fontes.push("pluviômetro do CNP " + fmt1(c.estacao_mmh) + " mm/h");
    if (c.radar && c.radar.eco_frac_10km > 0) fontes.push("radar com chuva em " + Math.round(c.radar.eco_frac_10km * 100) + "% dos 10 km em volta");
    if (c.metar_sdco && c.metar_sdco.chuva) fontes.push("METAR de Sorocaba com chuva");
    nota.textContent = "Chuva confirmada: " + fontes.join(" · ") + ".";
  } else {
    nota.textContent = "aberta a partir de " + Math.round(LIMIAR_AGORA * 100) + "% · média dos últimos 45 min";
  }
  alvo.append(resumo, chipsDe(s.prob_por_categoria, LIMIAR_AGORA), nota);
  if (parado) alvo.appendChild(avisoParado());
}

async function atualizarAgora() {
  try {
    const r = await fetch(URL_AGORA_JSON + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) {
      const novo = await r.json();
      if (novo && geradoEm(novo) > geradoEm(agoraDados)) agoraDados = novo;
    }
  } catch (err) { /* fica o Agora gravado na pagina */ }
  montarAgora();       // renova tambem o aviso de parado
}

// ---------- estacao do CNP: a leitura gravada na pagina (de hora em hora) ou,
// se mais nova, a do agora.json que a coleta do GitHub grava a cada ~20 min
// (o Klimadata nao deixa o navegador ler direto). "Ver ao vivo" abre o painel
// do proprio site da estacao, que se atualiza sozinho a cada 5 min.
const URL_ESTACAO_JSON = "https://raw.githubusercontent.com/fernandoliveiraf-sudo/previsao-cnp-boituva/estacao-cnp/dados/agora.json";
const URL_ESTACAO_VIVO = "https://klimadata.com/wx/boituva/kiosk.html";
let estacao = DADOS.estacao || null;
const fmt1 = x => x == null ? "–" : x.toLocaleString("pt-BR", { maximumFractionDigits: 1 });

function setaVento(graus) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 44 44");
  svg.setAttribute("class", "estacao-seta");
  svg.setAttribute("aria-hidden", "true");
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", "22"); c.setAttribute("cy", "22"); c.setAttribute("r", "20");
  svg.appendChild(c);
  if (graus != null) {
    // a seta (desenhada apontando para o norte) aponta para onde o vento VAI:
    // o vento vem de `graus`, entao vai para graus + 180
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", "M22 6 L29 22 L24 20 L24 36 L20 36 L20 20 L15 22 Z");
    p.setAttribute("transform", "rotate(" + ((graus + 180) % 360) + " 22 22)");
    svg.appendChild(p);
  }
  return svg;
}

function blocoNum(valor, unidade, rotulo) {
  const d = document.createElement("div");
  const n = document.createElement("div");
  n.className = "estacao-num";
  n.append(document.createTextNode(valor + " "));
  const u = document.createElement("small");
  u.textContent = unidade;
  n.appendChild(u);
  const r = document.createElement("div");
  r.className = "estacao-rot";
  r.textContent = rotulo;
  d.append(n, r);
  return d;
}

let ajustarJanela = null;
function abrirJanela(alvo, botao) {
  const ja = alvo.querySelector(".estacao-janela");
  if (ja) {
    ja.remove();
    botao.textContent = "ver ao vivo ▸";
    if (ajustarJanela) window.removeEventListener("resize", ajustarJanela);
    return;
  }
  const box = document.createElement("div");
  box.className = "estacao-janela";
  const f = document.createElement("iframe");
  f.src = URL_ESTACAO_VIVO;
  f.title = "Estação meteorológica do CNP ao vivo (Klimadata)";
  f.referrerPolicy = "no-referrer";
  box.appendChild(f);
  alvo.appendChild(box);
  ajustarJanela = () => {
    const k = Math.min(1, box.clientWidth / 800);
    f.style.transform = "scale(" + k + ")";
    box.style.height = Math.round(430 * k) + "px";
  };
  ajustarJanela();
  window.addEventListener("resize", ajustarJanela);
  botao.textContent = "fechar ▾";
}

function montarEstacao() {
  const alvo = document.getElementById("estacao");
  const janela = alvo.querySelector(".estacao-janela");   // mantem a janela aberta ao renovar
  alvo.replaceChildren();
  alvo.classList.remove("indisp", "velho");
  const cab = document.createElement("div");
  cab.className = "estacao-cab";
  const titulo = document.createElement("div");
  titulo.className = "estacao-titulo";
  const vivo = document.createElement("button");
  vivo.type = "button";
  vivo.className = "estacao-vivo";
  vivo.textContent = janela ? "fechar ▾" : "ver ao vivo ▸";
  vivo.addEventListener("click", () => abrirJanela(alvo, vivo));
  cab.append(titulo, vivo);
  alvo.appendChild(cab);
  const e = estacao;
  if (!e || e.status !== "ok") {
    alvo.classList.add("indisp");
    titulo.textContent = "Estação do CNP · leitura indisponível";
  } else {
    const idade = (Date.now() - new Date(e.ts_utc).getTime()) / 60000;
    titulo.textContent = "Estação do CNP · " + HORA(e.ts_utc) +
      (idade > 30 ? " (há " + (idade < 90 ? Math.round(idade) + " min" : Math.round(idade / 60) + " h") + ")" : "");
    if (idade > 30) alvo.classList.add("velho");
    const linha = document.createElement("div");
    linha.className = "estacao-vento";
    linha.appendChild(setaVento(e.direcao_graus));
    linha.appendChild(blocoNum(e.direcao_txt || "calmo",
      e.direcao_graus != null ? Math.round(e.direcao_graus) + "°" : "", "vento vem de"));
    linha.appendChild(blocoNum(e.vento_kmh == null ? "–" : Math.round(e.vento_kmh), "km/h", "vento"));
    const raj = e.rajada_max_30_kmh != null ? e.rajada_max_30_kmh : e.rajada_kmh;
    linha.appendChild(blocoNum(raj == null ? "–" : Math.round(raj), "km/h", "rajada (30 min)"));
    alvo.appendChild(linha);
    const resto = document.createElement("div");
    resto.className = "estacao-resto";
    const partes = [fmt1(e.temp_c) + " °C", "umidade " + fmt1(e.umidade) + "%",
      e.chuva_mmh > 0 ? "chovendo " + fmt1(e.chuva_mmh) + " mm/h"
                      : (e.choveu_30min ? "choveu nos últimos 30 min" : "sem chuva")];
    if (e.base_estimada_m != null) partes.push("base estimada ≈ " + e.base_estimada_m + " m");
    resto.textContent = partes.join(" · ");
    alvo.appendChild(resto);
  }
  if (janela) alvo.appendChild(janela);
}

async function atualizarEstacao() {
  try {
    const r = await fetch(URL_ESTACAO_JSON + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const novo = await r.json();
    if (novo && novo.status === "ok" &&
        (!estacao || estacao.status !== "ok" || new Date(novo.ts_utc) > new Date(estacao.ts_utc))) {
      estacao = novo;
    }
  } catch (err) { /* fica a leitura gravada na pagina */ }
  montarEstacao();     // renova tambem o "ha X min"
}

function montarRajada() {
  const alvo = document.getElementById("rajada");
  alvo.replaceChildren();
  const r = DADOS.rajada;
  const titulo = document.createElement("div");
  titulo.className = "rajada-titulo";
  alvo.appendChild(titulo);
  if (!r || r.status !== "ok") {
    alvo.classList.add("indisp");
    titulo.textContent = "Rajada · indisponível";
    return;
  }
  alvo.classList.remove("indisp");
  titulo.textContent = "Rajada · próximas horas";
  const grade = document.createElement("div");
  grade.className = "rajada-horas";
  for (const p of r.previsoes) {
    const c = document.createElement("div");
    c.className = "rajada-h";
    const q = document.createElement("div");
    q.className = "quando";
    q.textContent = "até " + HORA(p.ts_alvo_utc);
    const v = document.createElement("div");
    v.className = "valor";
    v.append(document.createTextNode(Math.round(p.rajada_kmh) + " "));
    const u = document.createElement("small");
    u.textContent = "km/h ± " + Math.round(p.mae_kmh);
    v.appendChild(u);
    const f = document.createElement("div");
    f.className = "faixa";
    f.textContent = p.faixa.texto;
    c.append(q, v, f);
    const al = p.alertas.filter(a => a.alerta);
    if (al.length) {
      const maior = al[al.length - 1];
      const a = document.createElement("div");
      a.className = "alerta";
      a.textContent = "⚠ pode chegar a " + maior.limite_kmh + " km/h · limite de " + maior.categorias;
      c.appendChild(a);
    }
    grade.appendChild(c);
  }
  alvo.appendChild(grade);
}

function montarTextos() {
  const fmt = new Date(DADOS.gerado_em).toLocaleString("pt-BR", {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo",
  });
  document.getElementById("gerado").textContent = "Atualizado em " + fmt;
}

montarTextos();
montarAgora();
atualizarAgora();
setInterval(atualizarAgora, 3 * 60 * 1000);   // a pagina aberta pega o Agora novo e percebe quando ele envelhece
montarEstacao();
atualizarEstacao();
setInterval(atualizarEstacao, 5 * 60 * 1000);
montarRajada();
montarSeletor();
montarQuadro();
</script>
