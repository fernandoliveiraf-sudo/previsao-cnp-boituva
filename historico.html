<style>
:root {
  --ceu: #e8edf2; --painel: #ffffff; --painel-2: #f2f5f8; --tinta: #16222e; --tinta-fraca: #5a6a78;
  --borda: #c9d4de; --biruta: #d9622b; --alta: #2f7a4d; --baixa: #ad3826;
  --alta-fundo: #e3f1e8; --baixa-fundo: #f9e4e0; --vazio: #e4e9ee;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --corpo: "Barlow", system-ui, -apple-system, sans-serif;
  --dados: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ceu: #11191f; --painel: #19242d; --painel-2: #1f2d37; --tinta: #e6eef4; --tinta-fraca: #94a6b4;
    --borda: #2e4050; --biruta: #f08350; --alta: #6fc492; --baixa: #ef8674;
    --alta-fundo: #1b3326; --baixa-fundo: #38201c; --vazio: #24323d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ceu: #11191f; --painel: #19242d; --painel-2: #1f2d37; --tinta: #e6eef4; --tinta-fraca: #94a6b4;
  --borda: #2e4050; --biruta: #f08350; --alta: #6fc492; --baixa: #ef8674;
  --alta-fundo: #1b3326; --baixa-fundo: #38201c; --vazio: #24323d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ceu); color: var(--tinta); font-family: var(--corpo); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 56px; }
.topo { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; }
.local { font-family: var(--display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--biruta); }
.nav { margin-left: auto; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; }
.nav a { color: var(--biruta); text-decoration: none; }
.nav a:hover { text-decoration: underline; }
.aviso { border-left: 3px solid var(--biruta); background: var(--painel); border-radius: 0 6px 6px 0;
  padding: 13px 16px; margin-bottom: 22px; font-size: 14px; font-weight: 600; }
.rotulo { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px;
  font-weight: 600; color: var(--tinta-fraca); display: block; margin-bottom: 7px; }
.botoes { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
.botoes button { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em;
  padding: 7px 15px; border-radius: 999px; border: 1px solid var(--borda); background: var(--painel);
  color: var(--tinta); cursor: pointer; }
.botoes button:hover { border-color: var(--biruta); }
.botoes button[aria-pressed="true"] { background: var(--biruta); border-color: var(--biruta); color: #fff; }
.botoes button:focus-visible { outline: 2px solid var(--biruta); outline-offset: 2px; }
.placar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; align-items: baseline; }
.chip { display: flex; align-items: baseline; gap: 6px; border: 1px solid var(--borda); border-radius: 6px;
  padding: 5px 9px; background: var(--painel); white-space: nowrap; }
.chip .cat { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
.chip .pct { font-family: var(--dados); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.n { font-family: var(--dados); font-size: 12px; color: var(--tinta-fraca); }
.quadro { display: flex; flex-direction: column; gap: 10px; }
.dia { background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; }
.cabeca { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; font: inherit; color: inherit;
  padding: 12px 16px; display: grid; grid-template-columns: 108px minmax(0, 1fr) 22px; gap: 4px 18px; align-items: center; }
.cabeca:hover { background: var(--painel-2); }
.cabeca:focus-visible { outline: 2px solid var(--biruta); outline-offset: -2px; }
.data-bloco { display: flex; flex-direction: column; }
.dia-semana { font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; line-height: 1.1; }
.data-num { font-family: var(--dados); font-size: 12px; color: var(--tinta-fraca); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seta { font-family: var(--dados); color: var(--tinta-fraca); justify-self: end; transition: transform .15s; }
.cabeca[aria-expanded="true"] .seta { transform: rotate(90deg); }
.detalhe { border-top: 1px solid var(--borda); padding: 14px 16px 16px; background: var(--painel-2); }
.grade-wrap { overflow-x: auto; padding-bottom: 4px; }
.grade { display: grid; gap: 2px; font-family: var(--dados); font-size: 12px; font-variant-numeric: tabular-nums; min-width: max-content; }
.g { padding: 4px 6px; border-radius: 3px; text-align: center; white-space: nowrap; }
.g.rot { font-family: var(--display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
  text-align: left; color: var(--tinta-fraca); padding-right: 10px; position: sticky; left: 0; background: var(--painel-2); }
.g.rot.cat { color: var(--tinta); font-weight: 700; font-size: 13px; }
.g.hora { font-weight: 600; color: var(--tinta-fraca); }
.g.sim { background: var(--alta-fundo); color: var(--alta); font-weight: 600; }
.g.nao { background: var(--baixa-fundo); color: var(--baixa); font-weight: 600; }
.g.vazio { background: var(--vazio); color: var(--tinta-fraca); }
.g.erro { box-shadow: inset 0 0 0 1.5px var(--biruta); }
.g.sep { height: 6px; padding: 0; }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 11px; font-size: 12px; color: var(--tinta-fraca); }
.legenda span { display: flex; align-items: center; gap: 5px; }
.legenda i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.vazio-msg { color: var(--tinta-fraca); font-size: 14px; }
@media (max-width: 560px) {
  .cabeca { grid-template-columns: minmax(0, 1fr) 22px; }
  .cabeca > .data-bloco { flex-direction: row; align-items: baseline; gap: 9px; }
  .cabeca > .chips { grid-column: 1 / -1; grid-row: 2; }
  .cabeca > .seta { grid-column: 2; grid-row: 1; }
}

      const c = h[k], p = c[fonte];
      const errou = p != null && c.real != null && (p >= L) !== c.real;
      g.appendChild(el("div", "g " + (p == null ? "vazio" : p >= L ? "sim" : "nao") + (errou ? " erro" : ""),
        p == null ? "·" : String(Math.round(p * 100))));
    }
    g.appendChild(el("div", "g rot", rot + " RTA"));
    for (const h of dia.horas) {
      const r = h[k].real;
      g.appendChild(el("div", "g " + (r == null ? "vazio" : r ? "sim" : "nao"), r == null ? "·" : r ? "aberta" : "fechada"));
    }
  });
  wrap.appendChild(g);
  painel.appendChild(wrap);
  const leg = el("div", "legenda");
  for (const [cor, txt] of [["var(--alta)", "aberta (previsto: " + Math.round(L * 100) + "% ou mais)"],
                            ["var(--baixa)", "fechada"], ["var(--biruta)", "erro"]]) {
    const s = el("span"), i = el("i");
    i.style.background = cor;
    s.append(i, document.createTextNode(txt));
    leg.appendChild(s);
  }
  painel.appendChild(leg);
  return painel;
}

function montarQuadro() {
  const alvo = document.getElementById("quadro");
  alvo.replaceChildren();
  if (!DADOS.dias.length) { alvo.appendChild(el("p", "vazio-msg", "Sem dias comparados ainda.")); return; }
  for (const dia of DADOS.dias) {
    const [a, m, d] = dia.data.split("-").map(Number);
    const dt = new Date(a, m - 1, d);
    const card = el("div", "dia");
    const cab = el("button", "cabeca");
    cab.type = "button";
    cab.setAttribute("aria-expanded", String(aberto === dia.data));
    const bloco = el("div", "data-bloco");
    bloco.append(el("span", "dia-semana", DIAS_SEM[dt.getDay()]),
                 el("span", "data-num", String(d).padStart(2, "0") + "/" + String(m).padStart(2, "0")));
    const chips = el("div", "chips");
    const ac = acertoDia(dia);
    for (const [k, rot] of CATS) chips.appendChild(chip(rot, ac[k]));
    const seta = el("span", "seta", "›");
    seta.setAttribute("aria-hidden", "true");
    cab.append(bloco, chips, seta);
    cab.addEventListener("click", () => { aberto = aberto === dia.data ? null : dia.data; montarQuadro(); });
    card.appendChild(cab);
    if (aberto === dia.data) card.appendChild(grade(dia));
    alvo.appendChild(card);
  }
}

function montarTudo() { montarFontes(); montarPlacar(); montarQuadro(); }
montarTudo();
</script>
